<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Personal Card</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #3182ce;
            --accent-hover: #2b6cb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 40px 30px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid var(--accent);
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }

        .btn-secondary:hover {
            background-color: rgba(49, 130, 206, 0.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Replace with your own image URL or relative path if you upload an image to your repo -->
        <img class="avatar" src="https://unsplash.com" alt="Profile Picture">
        
        <h1 class="name">Your Name</h1>
        <p class="title">Software Engineer / Designer</p>
        
        <p class="bio">
            Hi! I build digital products, open-source tools, and love solving complex problems. Welcome to my personal corner of the internet.
        </p>
        
        <div class="links">
            <a href="https://github.com" class="btn btn-primary" target="_blank" rel="noopener noreferrer">GitHub Profile</a>
            <a href="https://linkedin.com" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="mailto:your.email@example.com" class="btn btn-secondary">Contact Me</a>
        </div>
    </div>

</body>
</html>
